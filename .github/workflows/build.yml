name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run tests
        run: gradle test
      - name: Build plugin
        run: gradle build
      - name: Upload build report and JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drop-tracker-build
          path: |
            build/libs/*.jar
            build/reports/tests/test/
          if-no-files-found: warn
